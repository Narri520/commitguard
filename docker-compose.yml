version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: commitguard-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: commitguard-redis
    restart: always
    ports:
      - "6379:6379"

  python-ai:
    build: ./ai-service
    container_name: commitguard-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_PROVIDER=mock
      - AI_API_KEY=mock-key
      - CONFIDENCE_THRESHOLD=0.80

  node-backend:
    build: ./backend
    container_name: commitguard-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/commitguard
      - JWT_SECRET=commitguard-production-secret-key-2026
      - AI_SERVICE_URL=http://python-ai:8000
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - python-ai

  frontend:
    build: ./frontend
    container_name: commitguard-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - node-backend

volumes:
  mongo_data:
